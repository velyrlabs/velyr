# "velyr" as first element is replaced by --bin / VELYR_BIN (default target/release/velyr).
# Runtime memory plan RT-01: 10000 pending timers then cleared; rss_mb minus idle-hold is the per-timer cost.
name = "timers-pending-10k"
command = ["velyr", "run", "benches/fixtures/timers-pending-10k.js"]
iterations = 15
warmup = 3
metrics = ["wall_ms", "wall_ms_p95", "rss_mb", "cpu_seconds", "instructions", "cycles"]
