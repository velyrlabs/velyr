# "velyr" as first element is replaced by --bin / VELYR_BIN (default target/release/velyr).
# Runtime memory plan RT-01: idle process held 1.5 s; rss_mb is the idle RSS floor.
name = "idle-hold"
command = ["velyr", "run", "benches/fixtures/idle-hold.js"]
iterations = 15
warmup = 3
metrics = ["wall_ms", "wall_ms_p95", "rss_mb", "cpu_seconds", "instructions", "cycles"]
