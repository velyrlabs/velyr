name: probe
on:
  push:
    branches: ['probe/**']
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/event-loop-and-windows-tests
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p velyr-compat-node --lib --test facades_in_memory --no-fail-fast
