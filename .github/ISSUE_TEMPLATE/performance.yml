name: Performance
description: Something is slower or uses more memory than it should.
title: "perf: "
labels: ["kind/perf"]
body:
  - type: input
    id: version
    attributes:
      label: Velyr version
      description: Output of `velyr --version`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and target
      description: For example macOS 15 arm64, Ubuntu 24.04 x86_64-unknown-linux-gnu.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: The exact command line you ran.
      render: shell
    validations:
      required: true
  - type: input
    id: permissions
    attributes:
      label: Permission flags used
      description: For example `--allow-read`, or "none".
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest script or package that shows the problem.
      render: javascript
    validations:
      required: true
  - type: textarea
    id: measurements
    attributes:
      label: Measurements
      description: What you measured, how, and the comparison (another version, runtime or a budget from docs/PERFORMANCE-BUDGETS.md). Include numbers.
    validations:
      required: true
