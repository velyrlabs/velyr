name: Feature request
description: Propose a new capability or option.
title: "feat: "
labels: ["kind/feature"]
body:
  - type: markdown
    attributes:
      value: A change to the public surface (CLI flags, permissions model, JS-visible APIs) needs an RFC. Open it as a Discussion in the Ideas category labelled needs-rfc.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today, and what did you try?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to see, and the trade-offs you know of.
    validations:
      required: true
  - type: textarea
    id: permissions
    attributes:
      label: Permissions impact
      description: Which permission flags would this need, if any? Default deny stays the default.
  - type: input
    id: version
    attributes:
      label: Velyr version
      description: Output of `velyr --version`.
