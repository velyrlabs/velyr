[package]
name = "velyr-io-http"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
velyr-io-net = { path = "../io-net" }
velyr-runtime-errors = { path = "../runtime-errors" }
velyr-runtime-permissions = { path = "../runtime-permissions" }
velyr-runtime-resources = { path = "../runtime-resources" }
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy", "server-auto", "http1", "http2", "tokio"] }
rustls = { version = "=0.23.46", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
tokio.workspace = true
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws-lc-rs", "tls12"] }
tokio-util.workspace = true
tower-service = "0.3"
tracing.workspace = true
# HTTP/3 prototype (VELYR-122), off by default.
quinn = { version = "0.11", optional = true, default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }

[features]
http3 = ["dep:quinn", "dep:h3", "dep:h3-quinn"]

[dev-dependencies]
rcgen = "=0.14.10"

[lints]
workspace = true
