[package]
name = "velyr-io-tls"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
velyr-engine-api = { path = "../engine-api" }
velyr-io-net = { path = "../io-net" }
velyr-runtime-errors = { path = "../runtime-errors" }
velyr-runtime-event-loop = { path = "../runtime-event-loop" }
velyr-runtime-ops = { path = "../runtime-ops" }
velyr-runtime-permissions = { path = "../runtime-permissions" }
velyr-runtime-resources = { path = "../runtime-resources" }
rustls = { version = "=0.23.46", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-pki-types = { version = "=1.15.1", features = ["std"] }
rustls-platform-verifier = "=0.7.0"
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws-lc-rs", "tls12"] }
tracing.workspace = true

[dev-dependencies]
velyr-engine-v8 = { path = "../engine-v8" }
velyr-runtime-core = { path = "../runtime-core" }
velyr-web-core = { path = "../web-core" }
velyr-web-streams = { path = "../web-streams" }
rcgen = "=0.14.10"

[lints]
workspace = true
