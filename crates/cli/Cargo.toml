[package]
name = "velyr-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "velyr"
path = "src/main.rs"

[features]
default = ["profile-full"]
# Profiles (PRD section 11). Each adds capability features below; `cfg(feature = ...)` in the
# sources gates on those, so a crate is linked only when some selected profile needs it.
profile-minimal = []
profile-web = ["profile-minimal", "web", "typescript", "jsx"]
profile-node = ["profile-web", "npm", "node"]
profile-full = ["profile-node", "telemetry", "inspector", "velyr-engine-native?/intl-all-locales", "velyr-engine-native?/intl-experimental"]
# fetch, WebSocket, HTTP/TLS, `velyr serve`.
web = ["dep:velyr-web-fetch", "dep:velyr-web-websocket", "dep:velyr-io-http", "dep:velyr-io-tls"]
# npm resolver and `velyr add|install|remove`.
npm = ["dep:velyr-compat-npm"]
# `velyr-compat-napi` is a direct dependency so `build.rs` exports its `napi_*` from `velyr`.
node = ["npm", "typescript", "dep:velyr-compat-commonjs", "dep:velyr-compat-napi", "dep:velyr-compat-node"]
# TypeScript stripping in the module host.
typescript = ["dep:velyr-tooling-typescript", "dep:velyr-tooling-tsconfig"]
# JSX transform (.jsx and .tsx) in the module host.
jsx = ["dep:velyr-tooling-jsx", "dep:velyr-tooling-tsconfig"]
# OTLP/HTTP trace export, enabled at run time by OTEL_EXPORTER_OTLP_ENDPOINT or `telemetry` in velyr.json.
telemetry = ["dep:velyr-runtime-telemetry", "velyr-web-fetch?/telemetry"]
# Chrome DevTools Protocol server for `velyr run --inspect*` (V8 only).
inspector = ["dep:velyr-runtime-inspector"]
# Registers test-only globals such as `nativeAdd` (forwarded to velyr-runtime-ops).
test-ops = ["velyr-runtime-ops/test-ops"]
# `velyr run --engine native` (experimental engine, ADR-009); not part of any profile.
engine-native = ["dep:velyr-engine-native"]

[dependencies]
velyr-engine-api = { path = "../engine-api" }
velyr-engine-v8 = { path = "../engine-v8" }
velyr-engine-native = { path = "../engine-native", optional = true }
velyr-io-fs = { path = "../io-fs" }
velyr-io-http = { path = "../io-http", optional = true }
velyr-io-net = { path = "../io-net" }
velyr-io-process = { path = "../io-process" }
velyr-compat-npm = { path = "../compat-npm", optional = true }
velyr-compat-commonjs = { path = "../compat-commonjs", optional = true }
velyr-compat-napi = { path = "../compat-napi", optional = true }
velyr-compat-node = { path = "../compat-node", optional = true }
velyr-io-tls = { path = "../io-tls", optional = true }
velyr-tooling-typescript = { path = "../tooling-typescript", optional = true }
velyr-tooling-jsx = { path = "../tooling-jsx", optional = true }
velyr-tooling-tsconfig = { path = "../tooling-tsconfig", optional = true }
velyr-tooling-test = { path = "../tooling-test" }
velyr-runtime-core = { path = "../runtime-core" }
velyr-runtime-event-loop = { path = "../runtime-event-loop" }
velyr-runtime-modules = { path = "../runtime-modules" }
velyr-runtime-ops = { path = "../runtime-ops" }
velyr-runtime-permissions = { path = "../runtime-permissions" }
velyr-runtime-errors = { path = "../runtime-errors" }
velyr-runtime-resources = { path = "../runtime-resources" }
velyr-runtime-vfs = { path = "../runtime-vfs" }
glob = "0.3"
regex = "1"
velyr-runtime-telemetry = { path = "../runtime-telemetry", optional = true }
velyr-runtime-inspector = { path = "../runtime-inspector", optional = true }
velyr-runtime-workers = { path = "../runtime-workers" }
velyr-web-core = { path = "../web-core" }
velyr-web-crypto = { path = "../web-crypto" }
velyr-web-fetch = { path = "../web-fetch", optional = true }
velyr-web-websocket = { path = "../web-websocket", optional = true }
velyr-web-streams = { path = "../web-streams" }
bytes = "1"
clap.workspace = true
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Every oxc_* crate must share this exact version (ADR-012).
oxc_allocator = "=0.154.0"
oxc_ast = "=0.154.0"
oxc_ast_visit = "=0.154.0"
oxc_parser = "=0.154.0"
oxc_span = "=0.154.0"
jsonc-parser = { version = "0.34.0", features = ["serde"] }

# `build.rs` bakes the startup snapshot from the same op list and scripts as the binary
# (src/profiles/bootstrap.rs); optional ones follow the profile features above.
[build-dependencies]
velyr-engine-api = { path = "../engine-api" }
velyr-engine-v8 = { path = "../engine-v8" }
velyr-io-fs = { path = "../io-fs" }
velyr-io-net = { path = "../io-net" }
velyr-io-process = { path = "../io-process" }
velyr-io-tls = { path = "../io-tls", optional = true }
velyr-compat-commonjs = { path = "../compat-commonjs", optional = true }
velyr-compat-node = { path = "../compat-node", optional = true }
velyr-runtime-core = { path = "../runtime-core" }
velyr-runtime-ops = { path = "../runtime-ops" }
velyr-runtime-workers = { path = "../runtime-workers" }
velyr-web-core = { path = "../web-core" }
velyr-web-crypto = { path = "../web-crypto" }
velyr-web-fetch = { path = "../web-fetch", optional = true }
velyr-web-websocket = { path = "../web-websocket", optional = true }
velyr-web-streams = { path = "../web-streams" }

[dev-dependencies]
assert_cmd = "2.2"
tempfile = "3"
rcgen = "=0.14.10"
rustls = { version = "=0.23.46", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
base64 = "0.22"
flate2 = "1"
sha2 = "0.10"
tar = "0.4"
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }

[lints]
workspace = true
