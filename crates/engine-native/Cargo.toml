[package]
name = "velyr-engine-native"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
velyr-engine-api = { path = "../engine-api" }
velyr-engine-gc = { path = "../engine-gc" }
velyr-engine-vm = { path = "../engine-vm" }
velyr-runtime-errors = { path = "../runtime-errors" }
# Every oxc_* crate must share this exact version (ADR-012).
oxc_allocator = "=0.154.0"
oxc_ast = "=0.154.0"
oxc_parser = "=0.154.0"
oxc_semantic = "=0.154.0"
oxc_span = "=0.154.0"
# Intl (VELYR-114): ICU4X with compiled data, same 2.3 line as V8's temporal_rs.
icu_calendar = "2.1"
icu_collator = "2.1"
icu_datetime = "2.1"
icu_decimal = "2.1"
icu_locale = "2.1"
icu_plurals = "2.1"
icu_segmenter = "2.3"
fixed_decimal = { version = "0.7", features = ["ryu"] }
writeable = "0.6"
# Local time zone and the tzdb compiled into temporal_rs, for Date.
iana-time-zone = "0.1"
temporal_rs = "0.2.6"

[features]
default = []
# Intl negotiates every CLDR locale; without it only en and pt (profile-minimal).
intl-all-locales = []

[dev-dependencies]
velyr-engine-api-conformance = { path = "../engine-api-conformance" }

[lints]
workspace = true
